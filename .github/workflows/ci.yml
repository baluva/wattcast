name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests unitaires (dont le test anti-fuite)
        run: uv run pytest -q
      - name: dbt compile (syntaxe et graphe des modèles)
        working-directory: dbt
        run: uv run dbt parse --profiles-dir .
