[project]
name = "wattcast"
version = "0.1.0"
description = "Prévision J+1 de la consommation électrique, comparée à la prévision officielle de RTE"
readme = "README.md"
authors = [
    { name = "loueyBarbirou", email = "144142000+baluva@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "evidently>=0.7.23",
    "fastapi>=0.141.1",
    "holidays>=0.104",
    "httpx>=0.28.1",
    "huggingface-hub>=1.31.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.0",
    "pandas>=3.0.5",
    "plotly>=5.24.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "streamlit>=1.63.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
wattcast = "wattcast.cli:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff.lint.per-file-ignores]
# Gabarits HTML/CSS inline : les couper nuirait à la lisibilité.
"dashboard/*" = ["E501"]
